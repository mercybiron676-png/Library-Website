<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

<body>

  <header class="site-header">
    <a href="home.html" class="logo">
      <svg viewBox="0 0 48 40" fill="none" stroke="#f5b82e" stroke-width="3" stroke-linejoin="round" aria-hidden="true">
        <path d="M24 8C18 4 10 4 4 6V34C10 32 18 32 24 36C30 32 38 32 44 34V6C38 4 30 4 24 8ZM24 8V36"/>
      </svg>
      <span>Library</span>
    </a>
    <nav>
      <a href="home.html">Home</a>
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
    <a href="contact.html" class="user-icon" aria-label="Account">
      <svg viewBox="0 0 36 36" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
        <circle cx="18" cy="12" r="5"/>
        <path d="M8 26c3 5 17 5 20 0"/>
      </svg>

  </header>

  <main class="container">
    <h1>Contact Us</h1>
    <p>Have a question or suggestion? Send us a message or visit us.</p>

    <p><strong>Address:</strong> 408-40200, Kisii, Kenya<br>
       <strong>Email:</strong> info@kisiiuniversity.ac.ke<br>
       <strong>Phone:</strong> +254 720875082</p>

    <form>
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <button type="submit">Send Message</button>
    </form>
  </main>

  </footer>
